name: inversiones
description: "Plataforma de inversión asistida por IA de RiTech SAS (MVP en paper trading)"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  go_router: ^18.1.3
  google_sign_in: 7.2.0
  json_annotation: ^4.12.0
  supabase_flutter: ^2.18.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  build_runner: ^2.17.1
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  # Archivo (OFL), instancias estáticas: assets/fonts/archivo/LEEME.md (HU-116).
  fonts:
    - family: Archivo
      fonts:
        - asset: assets/fonts/archivo/Archivo-Regular.ttf
          weight: 400
        - asset: assets/fonts/archivo/Archivo-Medium.ttf
          weight: 500
        - asset: assets/fonts/archivo/Archivo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/archivo/Archivo-Bold.ttf
          weight: 700
    - family: ArchivoCondensado
      fonts:
        - asset: assets/fonts/archivo/ArchivoCondensado-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/archivo/ArchivoCondensado-Bold.ttf
          weight: 700
        - asset: assets/fonts/archivo/ArchivoCondensado-ExtraBold.ttf
          weight: 800
