name: Verificación completa de las cuatro historias
on:
  push:
    branches: [codex/verificar-historias-yulbastidas]
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: supabase/setup-cli@v3
        with:
          version: 2.122.0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - name: ChromeDriver en PATH
        run: echo "$CHROMEWEBDRIVER" >> "$GITHUB_PATH"
      - name: Verificar sin omitir E2E
        run: bash scripts/verificar.sh
      - name: Registros de funciones si hay un fallo
        if: failure()
        run: cat /tmp/funciones-e2e.log /tmp/chromedriver.log 2>/dev/null || true
